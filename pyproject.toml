[project]
name = "bio-gpt-prototype"
version = "0.1.0"
description = "Bio-GPT 1차년도 핵심기능 프로토타입 (LangGraph + RAG + 답변 검증)"
authors = [
    { name = "hongsunsik", email = "hongsunsik1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "openai>=3.24.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "streamlit>=1.65.0",
]


[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
